<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senin için 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#2d1740;--sky2:#0c0818;--text:#ffe9f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1f1033;--sky2:#07050f}}
:root[data-theme="dark"]{--sky1:#1f1033;--sky2:#07050f}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,var(--sky1),var(--sky2) 75%);background-color:var(--sky2);font-family:'Caveat',cursive,Georgia,serif;color:var(--text);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
svg{height:100%;width:min(100vw,560px);display:block;overflow:visible}
#stars,#fx{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.9}}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px #ffd36b88;animation:ff 9s ease-in-out infinite alternate}
@keyframes ff{from{transform:translate(0,0)}to{transform:translate(var(--fx),var(--fy))}}
.fall{position:absolute;top:-30px;width:14px;height:18px;background:linear-gradient(#ffe3ec,#ff6f9f);border-radius:0 100% 0 100%;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

.stem{stroke-dasharray:1;stroke-dashoffset:1;animation:grow 2s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.leaf{transform:scale(0);animation:pop 1.3s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.pt{transform:scale(.05,.02);opacity:0;cursor:pointer;animation:open 3s cubic-bezier(.25,.9,.3,1) forwards;animation-delay:var(--d)}
@keyframes open{0%{transform:scale(.18,.05) rotate(-14deg);opacity:0}15%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.deco{transform:scale(0);opacity:0;animation:open 3s cubic-bezier(.25,.9,.3,1) 3s forwards;pointer-events:none}
.ready .pt:not(.done){animation:pulse 2.2s ease-in-out infinite;animation-delay:var(--p)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;filter:brightness(1)}50%{transform:scale(1.06);opacity:1;filter:brightness(1.3)}}
.pt.done{animation:none;transform:scale(.97);opacity:.5;filter:none}
.core{transform:scale(0);transform-origin:200px 260px;animation:pop 1.1s cubic-bezier(.3,1.5,.5,1) 4s forwards;pointer-events:none}
.glow{opacity:0;animation:glow 3s ease-out 2.4s forwards;pointer-events:none}
@keyframes glow{to{opacity:.55}}
.fin .glow{animation:glow2 2s ease-out forwards}
@keyframes glow2{to{opacity:1}}
.sway{transform-origin:200px 592px;animation:sway 6s ease-in-out 5s infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
#card{position:fixed;left:6%;right:6%;top:calc(7% + env(safe-area-inset-top,0px));text-align:center;font-size:clamp(30px,8.2vw,44px);line-height:1.15;min-height:3.4em;opacity:0;text-shadow:0 0 18px #ff6f9faa;pointer-events:none;transition:opacity .6s}
#card.show{opacity:1}
#cnt{position:fixed;left:0;right:0;bottom:calc(2% + env(safe-area-inset-bottom,0px));text-align:center;font-size:22px;opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.star,.ff{animation:none}}
</style>
</head>
<body>
<div id="stars"></div><div id="fx"></div>
<svg id="s" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet" aria-label="Açan çiçek">
<defs>
<linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe6ee"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
<linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6f9"/><stop offset="1" stop-color="#ffc2d6"/></linearGradient>
<linearGradient id="lf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f7a4d"/><stop offset="1" stop-color="#7fd68f"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#ff7fab" stop-opacity=".8"/><stop offset="1" stop-color="#ff7fab" stop-opacity="0"/></radialGradient>
<radialGradient id="ct"><stop offset="0" stop-color="#fff3a8"/><stop offset="1" stop-color="#ff9fb8"/></radialGradient>
<path id="p" d="M0 0C-36-30-44-90-15-120L0-104 15-120C44-90 36-30 0 0Z"/>
<path id="q" d="M0 0C-20-18-24-52 0-68 24-52 20-18 0 0Z"/>
</defs>
<ellipse cx="200" cy="594" rx="150" ry="9" fill="#000" opacity=".45"/>
<g class="sway">
<path class="stem" pathLength="1" d="M200 592C195 490 207 400 200 262" fill="none" stroke="#2f9a5f" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(201 480)"><path class="leaf" style="animation-delay:1.2s" d="M0 0C32-26 78-24 104-62 70-72 22-58 0 0Z" fill="url(#lf)"/></g>
<g transform="translate(198 415) scale(-1 1)"><path class="leaf" style="animation-delay:1.6s" d="M0 0C30-22 66-20 88-52 58-60 18-48 0 0Z" fill="url(#lf)"/></g>
<circle class="glow" cx="200" cy="260" r="200" fill="url(#gl)"/>
<g id="fl" transform="translate(200 260)"></g>
<g id="in" transform="translate(200 260)"></g>
<g class="core"><circle cx="200" cy="260" r="18" fill="url(#ct)"/><g id="dots"></g></g>
</g>
</svg>
<div id="card"></div>
<div id="cnt"></div>
<script>
/* Yaprakların mesajları (saat yönünde, en üstten başlar). İstediğini değiştir. */
var NOTES=[
"gülümsediğin zaman dünya gülüyor",
"kokun, cenneti müjdeliyor",
"gözlerine baktığımda zaman duruyor",
"sesin, en güzel şarkıdan bile güzel",
"yanındayken en sade an bile bayram gibi",
"sen yanımdayken her yol eve çıkıyor",
"elin elimdeyken korkacak hiçbir şey kalmıyor",
"seni düşünmek, günün en güzel molası"
];
var FINAL="Bunlar sadece birkaçı. Seni sevmek için daha çok sebebim var 🌸";

var NS='http://www.w3.org/2000/svg',fl=document.getElementById('fl'),inn=document.getElementById('in'),
card=document.getElementById('card'),cnt=document.getElementById('cnt'),opened=0,i;

NOTES.forEach(function(t,i){
  var g=document.createElementNS(NS,'g');
  g.setAttribute('transform','rotate('+(i*45)+')');
  var u=document.createElementNS(NS,'use');
  u.setAttribute('href','#p');u.setAttribute('fill','url(#g1)');
  u.setAttribute('stroke','#fff');u.setAttribute('stroke-opacity','.2');
  u.setAttribute('class','pt');
  u.style.setProperty('--d',(1.8+i*.12)+'s');u.style.setProperty('--p',(i*.25)+'s');
  g.appendChild(u);fl.appendChild(g);
  g.addEventListener('click',function(){
    if(u.classList.contains('done')||!document.body.classList.contains('ready'))return;
    u.classList.add('done');opened++;
    try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
    say(t);hearts(3);
    cnt.textContent=opened+' / '+NOTES.length;
    if(opened===NOTES.length){setTimeout(function(){document.body.classList.add('fin');say(FINAL);hearts(30)},3200);}
  });
  var d=document.createElementNS(NS,'g');d.setAttribute('transform','rotate('+(i*45+22.5)+')');
  var q=document.createElementNS(NS,'use');q.setAttribute('href','#q');q.setAttribute('fill','url(#g2)');q.setAttribute('class','deco');
  d.appendChild(q);inn.appendChild(d);
});
var dots=document.getElementById('dots');
for(i=0;i<14;i++){var c=document.createElementNS(NS,'circle'),a=i*137.5*Math.PI/180,r=3+i*.95;
  c.setAttribute('cx',200+Math.cos(a)*r);c.setAttribute('cy',260+Math.sin(a)*r);c.setAttribute('r',1.6);c.setAttribute('fill','#c24a74');dots.appendChild(c);}

var st=document.getElementById('stars'),fx=document.getElementById('fx');
for(i=0;i<70;i++){var s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*3+'s';st.appendChild(s);}
for(i=0;i<8;i++){var f=document.createElement('i');f.className='ff';f.style.left=Math.random()*100+'%';f.style.top=(40+Math.random()*50)+'%';f.style.setProperty('--fx',(Math.random()*120-60)+'px');f.style.setProperty('--fy',(Math.random()*-120)+'px');f.style.animationDelay=Math.random()*-6+'s';fx.appendChild(f);}

function say(t){card.classList.remove('show');setTimeout(function(){card.textContent=t;card.classList.add('show')},250);}
function hearts(n){for(var k=0;k<n;k++)setTimeout(function(){
  var p=document.createElement('i');p.className='fall';
  p.style.left=(25+Math.random()*50)+'%';p.style.top='25%';
  p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
  p.style.animationDuration=(4+Math.random()*4)+'s';fx.appendChild(p);setTimeout(function(){p.remove()},9000);
},k*90);}
setTimeout(function(){document.body.classList.add('ready');say('yapraklara dokun 🌸')},5200);
</script>
</body>
</html>
